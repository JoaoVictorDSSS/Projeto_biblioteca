<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação | Bibliotecolandia</title>
    <link rel="stylesheet" href="../css/formularios.css">
</head>

<body>
    <header class="Cabecalho">
        <h1>Bibliotecolandia</h1>
        <h2>Doação de livro</h2>
        <nav><a href="operacoes.html" class="BotaoVoltar">Voltar às opções</a></nav>
    </header>
    <main class="Container">
        <h2>Dados da doação</h2>
        <p>Preencha as informações do livro e dos responsáveis pela doação.</p>
        <form class="formulario-livro"
            onsubmit="alert('Doação registrada como demonstração. Os dados não são salvos permanentemente.');return false;">
            <div class="painel-imagem"><label for="imagem">Imagem do livro</label><img class="preview-imagem"
                    id="preview" alt="Prévia da capa do livro"><input type="file" id="imagem" name="imagem"
                    accept="image/*" required><small>Escolha uma imagem para visualizar a capa.</small></div>
            <div class="campos-formulario">
                <div class="campo campo-largo"><label for="nomeLivro">Nome do livro</label><input id="nomeLivro"
                        name="nomeLivro" required placeholder="Digite o nome do livro"></div>
                <div class="campo campo-largo"><label for="emailCliente">E-mail do cliente</label><input type="email"
                        id="emailCliente" name="emailCliente" required placeholder="cliente@exemplo.com"></div>
                <div class="campo campo-largo"><label for="emailFuncionario">E-mail do funcionário</label><input
                        type="email" id="emailFuncionario" name="emailFuncionario" required
                        placeholder="funcionario@biblioteca.com"></div>
                <div class="acoes-formulario"><button class="botao" type="submit">Registrar doação</button></div>
            </div>
        </form>
    </main>
    <footer class="Rodape">
        <h3>Criadores do projeto:</h3>
        <p>João, Kevin e Murillo</p>
    </footer>
    <script>document.getElementById('imagem').addEventListener('change', function () { const file = this.files[0], preview = document.getElementById('preview'); if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; } });</script>
</body>

</html>
